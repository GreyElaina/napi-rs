[workspace]
resolver = "2"
members = [
  "./crates/backend",
  "./crates/build",
  "./crates/macro",
  "./crates/napi",
  "./crates/sys",
  "./examples/napi",
  "./examples/napi-shared",
  "./examples/binary",
  "./bench",
  "./memory-testing",
  "./examples/napi-cargo-test",
]
exclude = ["./testing"]

[workspace.package]
rust-version = "1.88"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"     # Must be opt-in
print_stderr = "warn"     # Must be opt-in
allow_attributes = "warn"

[profile.release]
lto = true

[profile.napi-rs-custom]
inherits = "dev"
codegen-units = 1024
