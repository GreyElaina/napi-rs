[package]
description = "Codegen backend for napi procedural macro"
edition = "2021"
homepage = "https://napi.rs"
license = "MIT"
name = "napi-derive-backend"
readme = "README.md"
repository = "https://github.com/napi-rs/napi-rs"
rust-version.workspace = true
version = "5.0.4"

[package.metadata.workspaces]
independent = true

[features]
noop = []
strict = []
tracing = []
type-def = []

[dependencies]
convert_case = "0.11"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["fold", "full", "extra-traits", "visit"] }

[dev-dependencies]
serde_json = "1"
